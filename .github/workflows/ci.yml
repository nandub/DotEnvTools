name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, analyze, and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      MODULE_NAME: DotEnvTools

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install quality dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          if (-not (Get-Module -ListAvailable -Name Pester)) {
              Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }

          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Run quality checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./scripts/Test-DotEnvToolsQuality.ps1 `
              -ModuleRoot . `
              -RunTests `
              -RunAnalyzer `
              -Verbose

      - name: Resolve module version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Import-PowerShellDataFile -Path "./Source/$env:MODULE_NAME.psd1"
          $moduleVersion = [string]$manifest.ModuleVersion

          if ([string]::IsNullOrWhiteSpace($moduleVersion)) {
              Write-Error 'ModuleVersion is empty.'
          }

          "MODULE_VERSION=$moduleVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved module version: $moduleVersion"

      - name: Build module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./scripts/Build-DotEnvTools.ps1 -NewVersion $env:MODULE_VERSION -Verbose

      - name: Smoke import built module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $builtModulePath = Join-Path -Path $PWD -ChildPath "dist/$env:MODULE_NAME/$env:MODULE_VERSION"
          $manifestPath = Join-Path -Path $builtModulePath -ChildPath "$env:MODULE_NAME.psd1"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              Write-Error "Built module manifest was not found: $manifestPath"
          }

          Import-Module $manifestPath -Force -ErrorAction Stop

          $module = Get-Module -Name $env:MODULE_NAME
          if ($null -eq $module) {
              Write-Error "Module '$env:MODULE_NAME' was not imported."
          }

          if ([string]$module.Version -ne $env:MODULE_VERSION) {
              Write-Error "Imported module version '$($module.Version)' does not match expected '$env:MODULE_VERSION'."
          }

          $commandCount = @(Get-Command -Module $env:MODULE_NAME).Count
          if ($commandCount -lt 1) {
              Write-Error 'No commands were exported by the built module.'
          }

          $testRoot = Join-Path -Path ([System.IO.Path]::GetTempPath()) -ChildPath "DotEnvTools-CI-$([guid]::NewGuid().ToString('N'))"
          New-Item -Path $testRoot -ItemType Directory -Force | Out-Null

          try {
              New-DotEnvFile -Path $testRoot -Name API_URL,DB_NAME -Force | Out-Null

              $envPath = Join-Path -Path $testRoot -ChildPath '.env'
              $examplePath = Join-Path -Path $testRoot -ChildPath '.env.example'

              Set-DotEnvValue -Path $envPath -Name API_URL -Value 'https://localhost:8443' | Out-Null
              Set-DotEnvValue -Path $envPath -Name DB_NAME -Value 'DotEnvDemo' | Out-Null

              $validation = Test-DotEnvFile -Path $envPath -ExamplePath $examplePath
              if (-not $validation.IsValid) {
                  Write-Error "Generated dotenv files failed validation: $($validation.Errors -join '; ')"
              }

              $value = Get-DotEnvValue -Path $envPath -Name API_URL
              if ($value -ne 'https://localhost:8443') {
                  Write-Error "Unexpected API_URL value: $value"
              }
          }
          finally {
              Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Imported $env:MODULE_NAME $($module.Version) with $commandCount exported commands on $env:RUNNER_OS."
