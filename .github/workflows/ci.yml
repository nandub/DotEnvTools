name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test, analyze, and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      MODULE_NAME: DotEnvTools

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install quality dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          if (-not (Get-Module -ListAvailable -Name Pester)) {
              Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck
          }

          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }

      - name: Run quality checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./scripts/Test-DotEnvToolsQuality.ps1 `
              -ModuleRoot . `
              -RunTests `
              -RunAnalyzer `
              -Verbose

      - name: Resolve module version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Import-PowerShellDataFile -Path "./Source/$env:MODULE_NAME.psd1"
          $moduleVersion = [string]$manifest.ModuleVersion

          if ([string]::IsNullOrWhiteSpace($moduleVersion)) {
              Write-Error 'ModuleVersion is empty.'
          }

          "MODULE_VERSION=$moduleVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved module version: $moduleVersion"

      - name: Build module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./scripts/Build-DotEnvTools.ps1 -NewVersion $env:MODULE_VERSION -Verbose

      - name: Smoke import built module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $builtModulePath = Join-Path -Path $PWD -ChildPath "dist/$env:MODULE_NAME/$env:MODULE_VERSION"
          $manifestPath = Join-Path -Path $builtModulePath -ChildPath "$env:MODULE_NAME.psd1"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              Write-Error "Built module manifest was not found: $manifestPath"
          }

          Import-Module $manifestPath -Force -ErrorAction Stop

          $module = Get-Module -Name $env:MODULE_NAME
          if ($null -eq $module) {
              Write-Error "Module '$env:MODULE_NAME' was not imported."
          }

          if ([string]$module.Version -ne $env:MODULE_VERSION) {
              Write-Error "Imported module version '$($module.Version)' does not match expected '$env:MODULE_VERSION'."
          }

          $commandCount = @(Get-Command -Module $env:MODULE_NAME).Count
          if ($commandCount -lt 1) {
              Write-Error 'No commands were exported by the built module.'
          }

          $testRoot = Join-Path -Path ([System.IO.Path]::GetTempPath()) -ChildPath "DotEnvTools-CI-$([guid]::NewGuid().ToString('N'))"
          New-Item -Path $testRoot -ItemType Directory -Force | Out-Null

          try {
              Initialize-DotEnvProject -Path $testRoot -Name API_URL,DB_NAME -Force | Out-Null

              $envPath = Join-Path -Path $testRoot -ChildPath '.env'
              $examplePath = Join-Path -Path $testRoot -ChildPath '.env.example'

              Set-DotEnvValue -Path $envPath -Name API_URL -Value 'https://localhost:8443' | Out-Null
              Set-DotEnvValue -Path $envPath -Name DB_NAME -Value 'DotEnvDemo' | Out-Null

              $validation = Test-DotEnvFile -Path $envPath -ExamplePath $examplePath
              if (-not $validation.IsValid) {
                  Write-Error "Generated dotenv files failed validation: $($validation.Errors -join '; ')"
              }

              $value = Get-DotEnvValue -Path $envPath -Name API_URL
              if ($value -ne 'https://localhost:8443') {
                  Write-Error "Unexpected API_URL value: $value"
              }
          }
          finally {
              Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Imported $env:MODULE_NAME $($module.Version) with $commandCount exported commands on $env:RUNNER_OS."

  devcontainer-feature:
    name: Build and test Dev Container Feature
    runs-on: ubuntu-latest
    needs: test

    env:
      MODULE_NAME: DotEnvTools

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve module version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Import-PowerShellDataFile -Path "./Source/$env:MODULE_NAME.psd1"
          $moduleVersion = [string]$manifest.ModuleVersion

          if ([string]::IsNullOrWhiteSpace($moduleVersion)) {
              Write-Error 'ModuleVersion is empty.'
          }

          "MODULE_VERSION=$moduleVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved module version: $moduleVersion"

      - name: Validate Feature metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $feature = Get-Content -Path './src/dotenvtools/devcontainer-feature.json' -Raw | ConvertFrom-Json

          if ($feature.id -ne 'dotenvtools') {
              Write-Error "Unexpected Feature id: $($feature.id)"
          }

          if ($feature.options.version.default -ne $env:MODULE_VERSION) {
              Write-Error "Feature default version '$($feature.options.version.default)' does not match module version '$env:MODULE_VERSION'."
          }

          if (-not (Test-Path -Path './src/dotenvtools/install.sh' -PathType Leaf)) {
              Write-Error 'Feature install.sh was not found.'
          }

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Build module archive for Feature test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./scripts/Build-DotEnvTools.ps1 -NewVersion $env:MODULE_VERSION -Verbose

      - name: Create Dev Container test fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $fixtureRoot = Join-Path -Path $PWD -ChildPath '.devcontainer-feature-test'
          $devcontainerRoot = Join-Path -Path $fixtureRoot -ChildPath '.devcontainer'
          $fixtureFeatureRoot = Join-Path -Path $devcontainerRoot -ChildPath 'features'
          New-Item -Path $devcontainerRoot -ItemType Directory -Force | Out-Null
          New-Item -Path $fixtureFeatureRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path './src/dotenvtools' -Destination $fixtureFeatureRoot -Recurse -Force
          Copy-Item -Path "dist/DotEnvTools-$env:MODULE_VERSION.zip" -Destination (Join-Path $fixtureFeatureRoot 'dotenvtools') -Force

          $config = [ordered]@{
              image = 'mcr.microsoft.com/devcontainers/base:ubuntu'
              features = [ordered]@{
                  'ghcr.io/devcontainers/features/powershell:2' = @{}
                  './features/dotenvtools' = [ordered]@{
                      version = $env:MODULE_VERSION
                      archivePath = "DotEnvTools-$env:MODULE_VERSION.zip"
                      initializeProject = $true
                      template = 'WebApp'
                      includeVariants = $true
                      environmentName = 'development'
                  }
              }
          }

          $config |
              ConvertTo-Json -Depth 10 |
              Set-Content -Path (Join-Path $devcontainerRoot 'devcontainer.json') -Encoding UTF8

      - name: Build and start Dev Container
        run: devcontainer up --workspace-folder .devcontainer-feature-test

      - name: Test Dev Container Feature
        run: |
          devcontainer exec --workspace-folder .devcontainer-feature-test pwsh -NoLogo -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            Import-Module DotEnvTools -Force
            $module = Get-Module DotEnvTools
            if ($null -eq $module) { throw "DotEnvTools was not imported." }
            if ([string]$module.Version -ne $env:MODULE_VERSION) { throw "Unexpected DotEnvTools version: $($module.Version)" }

            if (-not (Test-Path -LiteralPath ".env.example" -PathType Leaf)) { throw ".env.example was not created." }
            if (-not (Test-Path -LiteralPath ".env.local" -PathType Leaf)) { throw ".env.local was not created." }
            if (-not (Test-Path -LiteralPath ".env.development" -PathType Leaf)) { throw ".env.development was not created." }
            if (-not (Test-Path -LiteralPath ".env.development.local" -PathType Leaf)) { throw ".env.development.local was not created." }

            $appName = Get-DotEnvValue -Path ".env.example" -Name APP_NAME
            $databaseUrl = Get-DotEnvValue -Path ".env.example" -Name DATABASE_URL

            if ($appName -ne "MyApp") { throw "Unexpected APP_NAME: $appName" }
            if ($databaseUrl -ne "postgresql://app_user:change_me@localhost:5432/app_db") { throw "Unexpected DATABASE_URL: $databaseUrl" }
          '
